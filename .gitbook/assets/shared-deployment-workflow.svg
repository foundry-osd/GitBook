<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">Foundry deployment workflow</title>
  <desc id="description">Foundry OSD authors deployment media on an administrator workstation. The target device boots the media, Foundry Connect establishes network readiness in Windows PE, and Foundry Deploy selects inputs, applies Windows, verifies the deployment, and reboots.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1736"/>
      <stop offset="0.55" stop-color="#102b66"/>
      <stop offset="1" stop-color="#32126d"/>
    </linearGradient>
    <linearGradient id="osdAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="connectAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="deployAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1600" height="720" rx="28" fill="url(#background)"/>
  <circle cx="1450" cy="70" r="250" fill="#2563eb" opacity="0.12"/>
  <circle cx="120" cy="680" r="270" fill="#7c3aed" opacity="0.14"/>

  <text x="70" y="78" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Foundry deployment workflow</text>
  <text x="70" y="118" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="21">Author on the administrator workstation, then connect and deploy in Windows PE.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="390" height="440" rx="24" fill="#111f3c" stroke="#3b82f6" stroke-width="2"/>
    <rect x="70" y="170" width="390" height="8" rx="4" fill="url(#osdAccent)"/>
    <text x="105" y="222" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1">ADMINISTRATOR WORKSTATION</text>
    <text x="105" y="270" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Foundry OSD</text>
    <line x1="105" y1="295" x2="425" y2="295" stroke="#334b77" stroke-width="2"/>

    <circle cx="132" cy="345" r="24" fill="#2563eb"/>
    <text x="132" y="353" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1</text>
    <text x="172" y="340" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Author deployment media</text>
    <text x="172" y="372" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Configure deployment behavior</text>

    <rect x="105" y="414" width="320" height="66" rx="14" fill="#16294f"/>
    <text x="130" y="454" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="19">Create or update ISO and USB media</text>
    <rect x="105" y="494" width="320" height="66" rx="14" fill="#16294f"/>
    <text x="130" y="534" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="19">Include network and Windows settings</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="170" width="390" height="440" rx="24" fill="#171d3f" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="605" y="170" width="390" height="8" rx="4" fill="url(#connectAccent)"/>
    <text x="640" y="222" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1">TARGET DEVICE · WINDOWS PE</text>
    <text x="640" y="270" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Foundry Connect</text>
    <line x1="640" y1="295" x2="960" y2="295" stroke="#45416d" stroke-width="2"/>

    <circle cx="667" cy="345" r="24" fill="#7c3aed"/>
    <text x="667" y="353" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">2</text>
    <text x="707" y="340" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Establish network</text>
    <text x="707" y="372" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Continue when readiness checks pass</text>

    <rect x="640" y="414" width="320" height="66" rx="14" fill="#242652"/>
    <text x="665" y="454" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="19">Check Ethernet connectivity</text>
    <rect x="640" y="494" width="320" height="66" rx="14" fill="#242652"/>
    <text x="665" y="534" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="19">Connect to Wi-Fi when enabled</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1140" y="170" width="390" height="440" rx="24" fill="#102b3b" stroke="#22d3ee" stroke-width="2"/>
    <rect x="1140" y="170" width="390" height="8" rx="4" fill="url(#deployAccent)"/>
    <text x="1175" y="222" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="1">TARGET DEVICE · WINDOWS PE</text>
    <text x="1175" y="270" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Foundry Deploy</text>
    <line x1="1175" y1="295" x2="1495" y2="295" stroke="#285368" stroke-width="2"/>

    <rect x="1175" y="320" width="320" height="72" rx="14" fill="#14394c"/>
    <circle cx="1208" cy="356" r="20" fill="#0891b2"/>
    <text x="1208" y="363" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">3</text>
    <text x="1242" y="363" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Select deployment inputs</text>

    <rect x="1175" y="408" width="320" height="72" rx="14" fill="#14394c"/>
    <circle cx="1208" cy="444" r="20" fill="#0891b2"/>
    <text x="1208" y="451" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">4</text>
    <text x="1242" y="451" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Apply and configure Windows</text>

    <rect x="1175" y="496" width="320" height="72" rx="14" fill="#14394c"/>
    <circle cx="1208" cy="532" r="20" fill="#059669"/>
    <text x="1208" y="539" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">5</text>
    <text x="1242" y="539" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Verify and reboot</text>
  </g>

  <g fill="none" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)">
    <path d="M 480 390 H 575"/>
    <path d="M 1015 390 H 1110"/>
  </g>
  <g fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <text x="528" y="360">BOOT MEDIA</text>
    <text x="1063" y="360">NETWORK READY</text>
  </g>

  <g fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    <text x="70" y="665">Author once</text>
    <text x="260" y="665" text-anchor="middle">→</text>
    <text x="300" y="665">Boot the target device</text>
    <text x="570" y="665" text-anchor="middle">→</text>
    <text x="610" y="665">Establish connectivity</text>
    <text x="900" y="665" text-anchor="middle">→</text>
    <text x="940" y="665">Deploy Windows</text>
    <text x="1160" y="665" text-anchor="middle">→</text>
    <text x="1200" y="665">Verify before rebooting</text>
  </g>
</svg>
