<svg xmlns="http://www.w3.org/2000/svg" width="720" height="920" viewBox="0 0 720 920" role="img" aria-labelledby="title description">
  <title id="title">Foundry deployment workflow</title>
  <desc id="description">Foundry OSD authors deployment media on an administrator workstation. The target device boots the media, Foundry Connect establishes network readiness in Windows PE, and Foundry Deploy selects inputs, applies Windows, verifies the deployment, and reboots.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1736"/>
      <stop offset="0.55" stop-color="#102b66"/>
      <stop offset="1" stop-color="#32126d"/>
    </linearGradient>
    <linearGradient id="osdAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="connectAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="deployAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="720" height="920" rx="24" fill="url(#background)"/>
  <circle cx="650" cy="40" r="180" fill="#2563eb" opacity="0.12"/>
  <circle cx="60" cy="890" r="200" fill="#7c3aed" opacity="0.14"/>

  <text x="40" y="56" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Foundry deployment workflow</text>
  <text x="40" y="88" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Author the media, establish connectivity, then deploy Windows.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="120" width="640" height="200" rx="20" fill="#111f3c" stroke="#3b82f6" stroke-width="2"/>
    <rect x="40" y="120" width="640" height="8" rx="4" fill="url(#osdAccent)"/>
    <text x="70" y="164" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">ADMINISTRATOR WORKSTATION</text>
    <text x="70" y="205" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Foundry OSD</text>
    <circle cx="92" cy="260" r="22" fill="#2563eb"/>
    <text x="92" y="268" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">1</text>
    <text x="130" y="254" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Author deployment media</text>
    <text x="130" y="286" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Configure deployment behavior and create ISO or USB media.</text>
  </g>

  <path d="M 360 330 V 360" fill="none" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="390" y="351" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">BOOT MEDIA</text>

  <g filter="url(#shadow)">
    <rect x="40" y="380" width="640" height="200" rx="20" fill="#171d3f" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="40" y="380" width="640" height="8" rx="4" fill="url(#connectAccent)"/>
    <text x="70" y="424" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">TARGET DEVICE · WINDOWS PE</text>
    <text x="70" y="465" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Foundry Connect</text>
    <circle cx="92" cy="520" r="22" fill="#7c3aed"/>
    <text x="92" y="528" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">2</text>
    <text x="130" y="514" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Establish network readiness</text>
    <text x="130" y="546" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Check Ethernet and optional Wi-Fi, then continue when ready.</text>
  </g>

  <path d="M 360 590 V 620" fill="none" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="390" y="611" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">NETWORK READY</text>

  <g filter="url(#shadow)">
    <rect x="40" y="640" width="640" height="240" rx="20" fill="#102b3b" stroke="#22d3ee" stroke-width="2"/>
    <rect x="40" y="640" width="640" height="8" rx="4" fill="url(#deployAccent)"/>
    <text x="70" y="684" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">TARGET DEVICE · WINDOWS PE</text>
    <text x="70" y="725" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Foundry Deploy</text>

    <circle cx="92" cy="770" r="19" fill="#0891b2"/>
    <text x="92" y="777" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">3</text>
    <text x="126" y="777" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Select deployment inputs</text>

    <circle cx="370" cy="770" r="19" fill="#0891b2"/>
    <text x="370" y="777" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">4</text>
    <text x="404" y="777" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Apply Windows</text>

    <circle cx="92" cy="832" r="19" fill="#059669"/>
    <text x="92" y="839" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">5</text>
    <text x="126" y="839" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Verify the deployment and reboot</text>
  </g>
</svg>
