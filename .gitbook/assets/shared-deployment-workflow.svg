<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1190" viewBox="0 0 720 1190" role="img" aria-labelledby="title description">
  <title id="title">Foundry deployment workflow</title>
  <desc id="description">Six phases. On the administrator workstation, Foundry OSD prepares the deployment media. The target device starts from the media: the Windows PE startup prepares Windows PE and starts the applications, Foundry Connect checks network access, and Foundry Deploy lets the technician choose the disk, Windows and drivers, then installs Windows. After the restart, setup finishes in Windows before the first sign-in.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1736"/>
      <stop offset="0.55" stop-color="#102b66"/>
      <stop offset="1" stop-color="#32126d"/>
    </linearGradient>
    <linearGradient id="osdAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="connectAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="deployAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="windowsAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="720" height="1190" rx="24" fill="url(#background)"/>
  <circle cx="650" cy="40" r="180" fill="#2563eb" opacity="0.12"/>
  <circle cx="60" cy="1160" r="200" fill="#7c3aed" opacity="0.14"/>

  <text x="40" y="56" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Foundry deployment workflow</text>
  <text x="40" y="88" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Prepare the media, start the device, then deploy Windows.</text>


  <g filter="url(#shadow)">
    <rect x="40" y="120" width="640" height="150" rx="20" fill="#111f3c" stroke="#3b82f6" stroke-width="2"/>
    <rect x="40" y="120" width="640" height="8" rx="4" fill="url(#osdAccent)"/>
    <text x="70" y="162" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">ADMINISTRATOR WORKSTATION</text>
    <text x="70" y="200" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Foundry OSD</text>
    <circle cx="92" cy="236" r="19" fill="#2563eb"/>
    <text x="92" y="242" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">1</text>
    <text x="126" y="243" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Prepare the deployment media</text>
  </g>

  <path d="M 360 280 V 310" fill="none" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="390" y="301" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">ISO FILE OR USB DRIVE</text>

  <g filter="url(#shadow)">
    <rect x="40" y="330" width="640" height="150" rx="20" fill="#171d3f" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="40" y="330" width="640" height="8" rx="4" fill="url(#connectAccent)"/>
    <text x="70" y="372" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">TARGET DEVICE · WINDOWS PE</text>
    <text x="70" y="410" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Windows PE startup</text>
    <circle cx="92" cy="446" r="19" fill="#7c3aed"/>
    <text x="92" y="452" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">2</text>
    <text x="126" y="453" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Prepare Windows PE and start the applications</text>
  </g>

  <path d="M 360 490 V 520" fill="none" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="540" width="640" height="150" rx="20" fill="#171d3f" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="40" y="540" width="640" height="8" rx="4" fill="url(#connectAccent)"/>
    <text x="70" y="582" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">TARGET DEVICE · WINDOWS PE</text>
    <text x="70" y="620" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Foundry Connect</text>
    <circle cx="92" cy="656" r="19" fill="#7c3aed"/>
    <text x="92" y="662" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">3</text>
    <text x="126" y="663" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Check network access</text>
  </g>

  <path d="M 360 700 V 730" fill="none" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="390" y="721" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">NETWORK READY</text>

  <g filter="url(#shadow)">
    <rect x="40" y="750" width="640" height="200" rx="20" fill="#102b3b" stroke="#22d3ee" stroke-width="2"/>
    <rect x="40" y="750" width="640" height="8" rx="4" fill="url(#deployAccent)"/>
    <text x="70" y="792" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">TARGET DEVICE · WINDOWS PE</text>
    <text x="70" y="830" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Foundry Deploy</text>
    <circle cx="92" cy="866" r="19" fill="#0891b2"/>
    <text x="92" y="872" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">4</text>
    <text x="126" y="873" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Choose the disk, Windows and drivers</text>
    <circle cx="92" cy="916" r="19" fill="#0891b2"/>
    <text x="92" y="922" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">5</text>
    <text x="126" y="923" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Install Windows</text>
  </g>

  <path d="M 360 960 V 990" fill="none" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="390" y="981" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">RESTART</text>

  <g filter="url(#shadow)">
    <rect x="40" y="1010" width="640" height="150" rx="20" fill="#0f2f2a" stroke="#34d399" stroke-width="2"/>
    <rect x="40" y="1010" width="640" height="8" rx="4" fill="url(#windowsAccent)"/>
    <text x="70" y="1052" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.8">TARGET DEVICE · WINDOWS</text>
    <text x="70" y="1090" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">After the restart</text>
    <circle cx="92" cy="1126" r="19" fill="#059669"/>
    <text x="92" y="1132" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">6</text>
    <text x="126" y="1133" fill="#f1f5f9" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Finish setup before the first sign-in</text>
  </g>

</svg>
