<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
  <title id="title">Foundry deployment workflow</title>
  <desc id="description">Foundry OSD authors deployment media on an administrator workstation. The target device boots the media, Foundry Connect establishes network readiness in Windows PE, and Foundry Deploy selects inputs, applies Windows, verifies the deployment, and reboots.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1736"/>
      <stop offset="0.55" stop-color="#102b66"/>
      <stop offset="1" stop-color="#32126d"/>
    </linearGradient>
    <linearGradient id="osdAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="connectAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="deployAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1280" height="520" rx="24" fill="url(#background)"/>
  <circle cx="1180" cy="40" r="220" fill="#2563eb" opacity="0.12"/>
  <circle cx="80" cy="510" r="230" fill="#7c3aed" opacity="0.14"/>

  <text x="50" y="58" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Foundry deployment workflow</text>
  <text x="50" y="92" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="19">Author on the administrator workstation, then connect and deploy in Windows PE.</text>

  <g filter="url(#shadow)">
    <rect x="50" y="130" width="300" height="330" rx="20" fill="#111f3c" stroke="#3b82f6" stroke-width="2"/>
    <rect x="50" y="130" width="300" height="8" rx="4" fill="url(#osdAccent)"/>
    <text x="78" y="178" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.8">ADMINISTRATOR WORKSTATION</text>
    <text x="78" y="220" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Foundry OSD</text>
    <line x1="78" y1="242" x2="322" y2="242" stroke="#334b77" stroke-width="2"/>

    <circle cx="104" cy="292" r="23" fill="#2563eb"/>
    <text x="104" y="300" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">1</text>
    <text x="142" y="286" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Author deployment</text>
    <text x="142" y="315" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">media</text>
    <text x="78" y="372" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Configure deployment behavior</text>
    <text x="78" y="407" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Create or update ISO and USB media</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="490" y="130" width="300" height="330" rx="20" fill="#171d3f" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="490" y="130" width="300" height="8" rx="4" fill="url(#connectAccent)"/>
    <text x="518" y="178" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.8">TARGET DEVICE · WINDOWS PE</text>
    <text x="518" y="220" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Foundry Connect</text>
    <line x1="518" y1="242" x2="762" y2="242" stroke="#45416d" stroke-width="2"/>

    <circle cx="544" cy="292" r="23" fill="#7c3aed"/>
    <text x="544" y="300" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">2</text>
    <text x="582" y="286" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Establish network</text>
    <text x="582" y="315" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">readiness</text>
    <text x="518" y="372" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Check Ethernet and optional Wi-Fi</text>
    <text x="518" y="407" fill="#ede9fe" font-family="Segoe UI, Arial, sans-serif" font-size="18">Continue when readiness checks pass</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="130" width="300" height="330" rx="20" fill="#102b3b" stroke="#22d3ee" stroke-width="2"/>
    <rect x="930" y="130" width="300" height="8" rx="4" fill="url(#deployAccent)"/>
    <text x="958" y="178" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="0.8">TARGET DEVICE · WINDOWS PE</text>
    <text x="958" y="220" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Foundry Deploy</text>
    <line x1="958" y1="242" x2="1202" y2="242" stroke="#285368" stroke-width="2"/>

    <circle cx="984" cy="282" r="19" fill="#0891b2"/>
    <text x="984" y="289" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">3</text>
    <text x="1018" y="289" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Select deployment inputs</text>

    <circle cx="984" cy="346" r="19" fill="#0891b2"/>
    <text x="984" y="353" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">4</text>
    <text x="1018" y="342" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Apply and configure</text>
    <text x="1018" y="368" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Windows</text>

    <circle cx="984" cy="418" r="19" fill="#059669"/>
    <text x="984" y="425" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">5</text>
    <text x="1018" y="425" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Verify and reboot</text>
  </g>

  <g fill="none" stroke="#93c5fd" stroke-width="5" marker-end="url(#arrow)">
    <path d="M 370 310 H 470"/>
    <path d="M 810 310 H 910"/>
  </g>
  <g fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <text x="420" y="282">BOOT MEDIA</text>
    <text x="860" y="282">NETWORK READY</text>
  </g>
</svg>
